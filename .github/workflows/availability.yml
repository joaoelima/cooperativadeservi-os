name: Check CoopServe availability
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: coopserve-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public health endpoint
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --connect-timeout 15 --max-time 75 https://coopserve-app.onrender.com/api/health
