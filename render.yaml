services:
  - type: web
    name: coopserve
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: coopserve
